plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'  // Asegúrate de aplicar el plugin aquí
}

android {
    namespace = "com.example.direccion_general_flutter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.direccion_general_flutter"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:20.7.0'  // Google Sign-In
    implementation 'androidx.multidex:multidex:2.0.1'  // Para manejo de múltiples dependencias
    implementation 'com.google.firebase:firebase-auth' // Firebase Authentication
}

apply plugin: 'com.google.gms.google-services'  // Aplicar el plugin de Google Services
